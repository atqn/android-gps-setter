name: Build Modified GPS Setter

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: Create temporary signing files
        run: |
          keytool -genkeypair \
            -keystore upload.jks \
            -storepass android \
            -keypass android \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=GPS Setter"

          echo "storeFile=../upload.jks" > local.properties
          echo "storePassword=android" >> local.properties
          echo "keyAlias=upload" >> local.properties
          echo "keyPassword=android" >> local.properties

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Build FOSS debug APK
        run: ./gradlew assembleFossDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GPS-Setter-FOSS-Modified
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
